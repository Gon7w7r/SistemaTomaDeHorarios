spring.application.name=tomadehorarios

spring.datasource.url=${DATABASE_URL:jdbc:mysql://localhost:3306/db_tomadehorarios?useSSL=false&serverTimezone=UTC}
spring.datasource.username=${DATABASE_USERNAME:root}
spring.datasource.password=${DATABASE_PASSWORD:1234}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

resend.api.key=${RESEND_API_KEY}

nexusmatch.url=${NEXUSMATCH_URL:http://localhost:8000}